<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberaka Tools</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d0d7de;
    --panel: #f6f8fa;
    --accent: #0969da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8d96a0;
      --border: #30363d;
      --panel: #161b22;
      --accent: #4493f8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 48px 24px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .subtitle { margin: 0 0 32px; color: var(--muted); }
  #search {
    width: 100%;
    margin-bottom: 20px;
    padding: 8px 12px;
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #tools {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  #tools a {
    display: block;
    height: 100%;
    padding: 16px;
    color: inherit;
    text-decoration: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  #tools a:hover, #tools a:focus-visible { border-color: var(--accent); outline: none; }
  #tools h2 { margin: 0 0 6px; font-size: 16px; color: var(--accent); }
  #tools p { margin: 0; color: var(--muted); font-size: 14px; }
  #empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Cyberaka Tools</h1>
  <p class="subtitle">Open source tools from Cyberaka. Pick one to open it.</p>
  <input id="search" type="search" placeholder="Filter tools" aria-label="Filter tools">
  <ul id="tools"></ul>
  <p id="empty" hidden>No tools match.</p>
</main>

<script src="tools.js"></script>
<script>
  const list = document.getElementById('tools');
  const search = document.getElementById('search');
  const empty = document.getElementById('empty');

  for (const tool of window.TOOLS) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    const h2 = document.createElement('h2');
    const p = document.createElement('p');
    a.href = tool.path;
    h2.textContent = tool.name;
    p.textContent = tool.description;
    a.append(h2, p);
    li.append(a);
    li.dataset.search = `${tool.name} ${tool.description}`.toLowerCase();
    list.append(li);
  }

  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    let shown = 0;
    for (const li of list.children) {
      li.hidden = !li.dataset.search.includes(q);
      if (!li.hidden) shown++;
    }
    empty.hidden = shown > 0;
  });
</script>
</body>
</html>
