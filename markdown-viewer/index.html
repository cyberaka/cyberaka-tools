<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Viewer</title>
<script>
  // Apply the saved theme before first paint to avoid a flash of the wrong colours.
  (function () {
    var pref = localStorage.getItem('markdown-viewer:theme') || 'auto';
    var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<!-- Colours and rendered-Markdown styles. "Export HTML" copies this block into the exported file. -->
<style id="doc-style">
  :root, [data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d0d7de;
    --panel: #f6f8fa;
    --accent: #0969da;
    --warn: #9a6700;
    --code-bg: rgba(175, 184, 193, 0.2);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8d96a0;
    --border: #30363d;
    --panel: #161b22;
    --accent: #4493f8;
    --warn: #d29922;
    --code-bg: rgba(110, 118, 129, 0.4);
  }

  .markdown { line-height: 1.6; overflow-wrap: break-word; }
  .markdown > :first-child, .markdown > :first-child > :first-child { margin-top: 0; }
  .markdown h1, .markdown h2 { border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  .markdown h1, .markdown h2, .markdown h3, .markdown h4, .markdown h5, .markdown h6 { margin: 1.4em 0 0.6em; line-height: 1.25; }
  .markdown a { color: var(--accent); }
  .markdown code {
    font: 85% ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--code-bg);
    padding: 0.2em 0.4em;
    border-radius: 6px;
  }
  .markdown pre { background: var(--panel); padding: 12px 16px; border-radius: 6px; overflow: auto; line-height: 1.45; }
  .markdown pre code { background: none; padding: 0; font-size: 85%; display: block; }
  .markdown blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: 4px solid var(--border); }
  .markdown table { border-collapse: collapse; display: block; overflow: auto; }
  .markdown th, .markdown td { border: 1px solid var(--border); padding: 6px 13px; }
  .markdown tr:nth-child(2n) { background: var(--panel); }
  .markdown img { max-width: 100%; }
  .markdown hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
  .markdown li > input[type="checkbox"] { margin-right: 0.4em; }
  .markdown .math-block { overflow-x: auto; margin: 1em 0; text-align: center; }
  .markdown .mermaid-diagram { margin: 1em 0; text-align: center; overflow-x: auto; }
  .markdown .mermaid-diagram svg { max-width: 100%; height: auto; }
  .markdown .render-error { color: #cf222e; font-size: 13px; white-space: pre-wrap; }

  /* Syntax highlighting colours, adapted from highlight.js "GitHub" and "GitHub Dark" themes
     (BSD-3-Clause, https://github.com/highlightjs/highlight.js). */
  .hljs-doctag, .hljs-keyword, .hljs-meta .hljs-keyword, .hljs-template-tag, .hljs-template-variable, .hljs-type, .hljs-variable.language_ { color: #d73a49; }
  .hljs-title, .hljs-title.class_, .hljs-title.class_.inherited__, .hljs-title.function_ { color: #6f42c1; }
  .hljs-attr, .hljs-attribute, .hljs-literal, .hljs-meta, .hljs-number, .hljs-operator, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id, .hljs-variable { color: #005cc5; }
  .hljs-meta .hljs-string, .hljs-regexp, .hljs-string { color: #032f62; }
  .hljs-built_in, .hljs-symbol { color: #e36209; }
  .hljs-code, .hljs-comment, .hljs-formula { color: #6a737d; }
  .hljs-name, .hljs-quote, .hljs-selector-pseudo, .hljs-selector-tag { color: #22863a; }
  .hljs-section { color: #005cc5; font-weight: 700; }
  .hljs-bullet { color: #735c0f; }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 700; }
  .hljs-addition { color: #22863a; background-color: #f0fff4; }
  .hljs-deletion { color: #b31d28; background-color: #ffeef0; }
  [data-theme="dark"] .hljs-doctag, [data-theme="dark"] .hljs-keyword, [data-theme="dark"] .hljs-meta .hljs-keyword, [data-theme="dark"] .hljs-template-tag, [data-theme="dark"] .hljs-template-variable, [data-theme="dark"] .hljs-type, [data-theme="dark"] .hljs-variable.language_ { color: #ff7b72; }
  [data-theme="dark"] .hljs-title, [data-theme="dark"] .hljs-title.class_, [data-theme="dark"] .hljs-title.class_.inherited__, [data-theme="dark"] .hljs-title.function_ { color: #d2a8ff; }
  [data-theme="dark"] .hljs-attr, [data-theme="dark"] .hljs-attribute, [data-theme="dark"] .hljs-literal, [data-theme="dark"] .hljs-meta, [data-theme="dark"] .hljs-number, [data-theme="dark"] .hljs-operator, [data-theme="dark"] .hljs-selector-attr, [data-theme="dark"] .hljs-selector-class, [data-theme="dark"] .hljs-selector-id, [data-theme="dark"] .hljs-variable { color: #79c0ff; }
  [data-theme="dark"] .hljs-meta .hljs-string, [data-theme="dark"] .hljs-regexp, [data-theme="dark"] .hljs-string { color: #a5d6ff; }
  [data-theme="dark"] .hljs-built_in, [data-theme="dark"] .hljs-symbol { color: #ffa657; }
  [data-theme="dark"] .hljs-code, [data-theme="dark"] .hljs-comment, [data-theme="dark"] .hljs-formula { color: #8b949e; }
  [data-theme="dark"] .hljs-name, [data-theme="dark"] .hljs-quote, [data-theme="dark"] .hljs-selector-pseudo, [data-theme="dark"] .hljs-selector-tag { color: #7ee787; }
  [data-theme="dark"] .hljs-section { color: #1f6feb; }
  [data-theme="dark"] .hljs-bullet { color: #f2cc60; }
  [data-theme="dark"] .hljs-addition { color: #aff5b4; background-color: #033a16; }
  [data-theme="dark"] .hljs-deletion { color: #ffdcd7; background-color: #67060c; }
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <a class="home" href="../index.html" title="All tools">← Tools</a>
  <h1>Markdown Viewer</h1>
  <div class="group">
    <button id="open" title="Open Markdown files (⌘O / Ctrl+O)">Open file…</button>
    <button id="open-folder" hidden title="Browse a folder's Markdown files in a sidebar">Open folder…</button>
    <button id="save" title="Save (⌘S / Ctrl+S)">Save</button>
    <button id="save-as" title="Save to a new file (⇧⌘S / Shift+Ctrl+S)">Save as…</button>
  </div>
  <div class="group" id="file-tools" hidden>
    <button id="reload" title="Re-read this file from disk">Reload</button>
    <label class="check" id="watch-label" title="Reload this file whenever it changes on disk">
      <input type="checkbox" id="watch"> Watch
    </label>
  </div>
  <input type="file" id="file-input" multiple accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden>
  <span id="status"></span>
  <details class="menu" id="export-menu">
    <summary>Export</summary>
    <div class="menu-items">
      <button id="export-html">Download as HTML</button>
      <button id="print">Print / Save as PDF</button>
      <button id="download-md">Download Markdown (.md)</button>
    </div>
  </details>
  <button id="theme" title="Colour theme"></button>
</header>

<nav id="tabs" aria-label="Open documents">
  <div id="tab-list" role="tablist"></div>
  <button id="new-tab" title="New scratch document">+</button>
</nav>

<main id="main">
  <aside id="files" hidden>
    <div class="pane-bar">
      <span class="pane-title" id="folder-name">Folder</span>
      <button id="refresh-folder" title="Rescan the folder">↻</button>
      <button id="close-folder" title="Close the folder sidebar">×</button>
    </div>
    <div id="file-tree"></div>
  </aside>

  <div id="split">
    <section class="pane" id="left-pane">
      <div class="pane-bar">
        <span class="pane-title"><b>Markdown</b><span class="pane-meta" id="counts"></span></span>
        <button id="copy-source" title="Copy the Markdown text">Copy</button>
        <button id="paste-source" title="Paste from the clipboard at the cursor">Paste</button>
        <button id="clear-source" title="Start fresh: empties a scratch document (⌘Z / Ctrl+Z undoes), or opens a new empty scratch tab when a file is shown">Clear</button>
        <button class="toggle" id="toggle-left" aria-expanded="true">«</button>
      </div>
      <div id="format-bar" role="toolbar" aria-label="Formatting">
        <button data-fmt="bold" title="Bold (⌘B / Ctrl+B)"><b>B</b></button>
        <button data-fmt="italic" title="Italic (⌘I / Ctrl+I)"><i>I</i></button>
        <button data-fmt="strike" title="Strikethrough (⇧⌘X / Shift+Ctrl+X)"><s>S</s></button>
        <button data-fmt="heading" title="Heading: cycles # / ## / ### / none (⇧⌘H / Shift+Ctrl+H)">H</button>
        <span class="sep"></span>
        <button data-fmt="link" title="Link (⌘K / Ctrl+K)">Link</button>
        <button data-fmt="code" title="Inline code (⌘E / Ctrl+E)">`code`</button>
        <button data-fmt="codeblock" title="Code block">{ }</button>
        <span class="sep"></span>
        <button data-fmt="ul" title="Bulleted list">•</button>
        <button data-fmt="ol" title="Numbered list">1.</button>
        <button data-fmt="task" title="Task list">☐</button>
        <button data-fmt="quote" title="Quote">❝</button>
        <span class="sep"></span>
        <button data-fmt="table" title="Insert a table">Table</button>
        <button data-fmt="hr" title="Horizontal rule">―</button>
      </div>
      <textarea id="source" spellcheck="false" placeholder="# Type or paste Markdown here"></textarea>
    </section>
    <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0"
         title="Drag to resize · double-click to reset · arrow keys to nudge"></div>
    <section class="pane" id="right-pane">
      <div class="pane-bar">
        <span class="pane-title"><b>Preview</b></span>
        <label class="check" title="Keep the preview scrolled to the same place as the Markdown"><input type="checkbox" id="sync-scroll"> Sync scroll</label>
        <button id="outline-toggle" aria-pressed="false" title="Show the list of headings">Outline</button>
        <button id="copy-preview" title="Copy the rendered output, with formatting, for email, docs, etc.">Copy</button>
        <button class="toggle" id="toggle-right" aria-expanded="true">»</button>
      </div>
      <div class="preview-wrap">
        <article id="preview" class="markdown"></article>
        <nav id="outline" hidden aria-label="Outline"></nav>
      </div>
    </section>
  </div>
</main>

<script src="vendor/marked/marked.umd.js"></script>
<script src="vendor/dompurify/purify.min.js"></script>
<script src="vendor/highlight/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
