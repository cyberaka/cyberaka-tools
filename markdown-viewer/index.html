<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Viewer</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d0d7de;
    --panel: #f6f8fa;
    --accent: #0969da;
    --code-bg: rgba(175, 184, 193, 0.2);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8d96a0;
      --border: #30363d;
      --panel: #161b22;
      --accent: #4493f8;
      --code-bg: rgba(110, 118, 129, 0.4);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0 12px 0 0; }
  header a.home { color: var(--muted); text-decoration: none; margin-right: 4px; }
  header a.home:hover { color: var(--accent); }
  button {
    font: inherit;
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; border-color: var(--border); }
  #status { color: var(--muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  label.watch { display: flex; align-items: center; gap: 4px; color: var(--muted); }

  main { flex: 1; display: flex; min-height: 0; }
  #source, #preview { flex: 1; min-width: 0; overflow: auto; }
  #source {
    margin: 0;
    padding: 16px;
    border: 0;
    border-right: 1px solid var(--border);
    resize: none;
    outline: none;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    tab-size: 4;
  }
  main.dragging #source { outline: 2px dashed var(--accent); outline-offset: -8px; }
  #preview { padding: 16px 32px; }

  /* Rendered Markdown */
  .markdown > :first-child { margin-top: 0; }
  .markdown h1, .markdown h2 { border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  .markdown h1, .markdown h2, .markdown h3, .markdown h4 { margin: 1.4em 0 0.6em; line-height: 1.25; }
  .markdown a { color: var(--accent); }
  .markdown code {
    font: 85% ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--code-bg);
    padding: 0.2em 0.4em;
    border-radius: 6px;
  }
  .markdown pre { background: var(--panel); padding: 12px 16px; border-radius: 6px; overflow: auto; }
  .markdown pre code { background: none; padding: 0; font-size: 85%; }
  .markdown blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: 4px solid var(--border); }
  .markdown table { border-collapse: collapse; display: block; overflow: auto; }
  .markdown th, .markdown td { border: 1px solid var(--border); padding: 6px 13px; }
  .markdown tr:nth-child(2n) { background: var(--panel); }
  .markdown img { max-width: 100%; }
  .markdown hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
  .markdown li > input[type="checkbox"] { margin-right: 0.4em; }

  @media (max-width: 700px) {
    main { flex-direction: column; }
    #source { border-right: 0; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <a class="home" href="../index.html" title="All tools">← Tools</a>
  <h1>Markdown Viewer</h1>
  <button id="open" title="Open a Markdown file from your computer">Open file…</button>
  <button id="reload" disabled title="Re-read the opened file from disk">Reload</button>
  <label class="watch" id="watch-label" hidden title="Re-read the file whenever it changes on disk">
    <input type="checkbox" id="watch"> Watch
  </label>
  <input type="file" id="file-input" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden>
  <span id="status">Type or paste Markdown, open a file, or drop one on the left pane.</span>
</header>
<main id="main">
  <textarea id="source" spellcheck="false" placeholder="# Type Markdown here"></textarea>
  <article id="preview" class="markdown"></article>
</main>

<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script>
  const source = document.getElementById('source');
  const preview = document.getElementById('preview');
  const status = document.getElementById('status');
  const openBtn = document.getElementById('open');
  const reloadBtn = document.getElementById('reload');
  const watchLabel = document.getElementById('watch-label');
  const watchBox = document.getElementById('watch');
  const fileInput = document.getElementById('file-input');
  const main = document.getElementById('main');

  const DRAFT_KEY = 'markdown-viewer:draft';
  // The File System Access API (Chromium browsers) keeps a handle to the file, so it can be
  // re-read later; elsewhere we fall back to a plain file input, which is a one-time snapshot.
  const hasFsAccess = 'showOpenFilePicker' in window;

  let fileHandle = null;
  let lastModified = 0;
  let watchTimer = null;

  marked.setOptions({ gfm: true, breaks: false });

  function render() {
    // Markdown may contain raw HTML, so sanitize before inserting it into the page.
    preview.innerHTML = DOMPurify.sanitize(marked.parse(source.value));
    for (const a of preview.querySelectorAll('a[href]')) {
      if (!a.getAttribute('href').startsWith('#')) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
    }
  }

  let renderQueued = false;
  source.addEventListener('input', () => {
    if (!fileHandle) localStorage.setItem(DRAFT_KEY, source.value);
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(); });
  });

  // Let Tab insert indentation instead of moving focus.
  source.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab' || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
    e.preventDefault();
    document.execCommand('insertText', false, '    ');
  });

  function setStatus(text) {
    status.textContent = text;
    status.title = text;
  }

  async function readHandle() {
    const file = await fileHandle.getFile();
    lastModified = file.lastModified;
    source.value = await file.text();
    render();
    setStatus(`${file.name} · loaded ${new Date().toLocaleTimeString()}`);
  }

  function stopWatching() {
    clearInterval(watchTimer);
    watchTimer = null;
    watchBox.checked = false;
  }

  async function useHandle(handle) {
    stopWatching();
    fileHandle = handle;
    reloadBtn.disabled = false;
    watchLabel.hidden = false;
    await readHandle();
  }

  function useSnapshot(file) {
    stopWatching();
    fileHandle = null;
    reloadBtn.disabled = true;
    watchLabel.hidden = true;
    file.text().then((text) => {
      source.value = text;
      render();
      setStatus(`${file.name} · edits here are not saved to the file`);
    });
  }

  openBtn.addEventListener('click', async () => {
    if (!hasFsAccess) { fileInput.click(); return; }
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdown', '.mkd'], 'text/plain': ['.txt'] } }],
      });
      await useHandle(handle);
    } catch (err) {
      if (err.name !== 'AbortError') setStatus(`Could not open file: ${err.message}`);
    }
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) useSnapshot(fileInput.files[0]);
    fileInput.value = '';
  });

  reloadBtn.addEventListener('click', () => {
    readHandle().catch((err) => setStatus(`Could not reload: ${err.message}`));
  });

  watchBox.addEventListener('change', () => {
    if (!watchBox.checked) { stopWatching(); return; }
    watchTimer = setInterval(async () => {
      try {
        const file = await fileHandle.getFile();
        if (file.lastModified !== lastModified) await readHandle();
      } catch (err) {
        stopWatching();
        setStatus(`Stopped watching: ${err.message}`);
      }
    }, 1000);
  });

  // Drag and drop a file onto either pane.
  main.addEventListener('dragover', (e) => {
    e.preventDefault();
    main.classList.add('dragging');
  });
  main.addEventListener('dragleave', (e) => {
    if (!main.contains(e.relatedTarget)) main.classList.remove('dragging');
  });
  main.addEventListener('drop', async (e) => {
    e.preventDefault();
    main.classList.remove('dragging');
    const item = e.dataTransfer.items && e.dataTransfer.items[0];
    if (item && item.getAsFileSystemHandle) {
      const handle = await item.getAsFileSystemHandle();
      if (handle && handle.kind === 'file') { await useHandle(handle); return; }
    }
    const file = e.dataTransfer.files[0];
    if (file) useSnapshot(file);
  });

  source.value = localStorage.getItem(DRAFT_KEY) ?? [
    '# Markdown Viewer',
    '',
    'Type on the left and the preview updates as you go. **Bold**, *italic*, `code`, and [links](https://commonmark.org) all work.',
    '',
    '- [x] GitHub-flavored task lists',
    '- [ ] Tables, fenced code, strikethrough',
    '',
    '| Feature | Supported |',
    '| ------- | --------- |',
    '| Tables  | Yes       |',
    '',
    '```js',
    'console.log("hello");',
    '```',
    '',
    '> Use **Open file…** or drop a `.md` file here to load it.',
  ].join('\n');
  render();
</script>
</body>
</html>
